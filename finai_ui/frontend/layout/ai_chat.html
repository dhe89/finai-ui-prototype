<div class="ai-panel" aria-label="AI Assistant">
  <div class="ai-head">
    <div><div class="ai-title">AI Assistant</div><div class="ai-status"><span class="dot"></span>Ready to assist</div></div>
    <div class="ai-actions"><button id="ai-hide" class="ai-hide" aria-label="Hide AI Assistant" title="Hide AI Assistant" type="button">−</button><button id="ai-close" class="ai-close" aria-label="Close AI Assistant" title="Close AI Assistant" type="button">×</button></div>
  </div>
  <div id="ai-body" class="ai-body">
    <div class="msg"><div class="bot">✦</div><div class="msgtext"><b>Hi there! 👋</b><br><span class="muted">I'm your Financial AI Assistant.<br>Ask me about the dashboard.</span></div></div>
  </div>
  <div class="ai-foot"><div class="ai-input-row"><input id="ai-input" class="ai-input" placeholder="Tanyakan sesuatu tentang kinerja keuangan..." autocomplete="off"><button id="ai-send" class="ai-send" aria-label="Send" type="button">↑</button></div></div>
</div>
